<script>
const KEY=["A","B","C","D","E"];
// kunci jawaban resmi (110 soal, urut)
const AK=["B","C","A","D","B","C","A","D","B","C","B","A","D","C","B","A","D","C","B","A","C","B","D","A","C","B","D","A","C","B","B","C","A","B","B","C","B","C","B","B","B","C","A","B","C","B","A","B","A","C","B","A","B","C","B","A","B","B","A","B","B","C","B","A","A","B","B","B","B","C","A","B","B","B","A","B","B","A","B","B","A","B","A","A","A","A","A","A","B","B","C","C","B","B","B","C","A","A","C","C","C","C","C","C","A","B","C","E","B","B"];
const Q=D.split("\n").map((l,i)=>{const p=l.split(" ## ");const a=AK[i];return{t:p[0],o:p.slice(1),a:KEY.indexOf(a),b:i<10?0:i<20?1:i<30?2:i<40?3:i<50?4:i<60?5:i<70?6:i<80?7:i<90?8:9}});
const app=document.getElementById("app");
let cur=0,ans=new Array(Q.length).fill(null),started=false;
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
const fmt=s=>esc(s).replace(/\*(.+?)\*/g,"<i>$1</i>");
function start(){started=true;cur=0;ans.fill(null);render()}
function render(){
 if(!started){app.innerHTML=`<div class="card"><h1>Kuis Pilihan Ganda FKG UNIMUS</h1><p class="mut">${Q.length} soal dalam ${BAB.length} bab. Satu soal per halaman, jawaban langsung diperiksa, nilai akhir ditampilkan di akhir.</p><button class="b" onclick="start()">Mulai Kuis</button></div>`;return}
 const q=Q[cur],c=ans[cur],done=ans.filter(x=>x!==null).length;
 const opts=q.o.map((t,i)=>{let cl="";if(c!==null){if(i===q.a)cl="ok";else if(i===c)cl="no"}
  return `<button class="opt ${cl}" ${c!==null?"disabled":""} onclick="pick(${i})"><b>${KEY[i]}</b><span>${fmt(t)}</span></button>`}).join("");
 const fb=c===null?"":c===q.a?`<div class="fb ok">✓ Benar!</div>`:`<div class="fb no">✗ Salah. Jawaban benar: ${KEY[q.a]}. ${fmt(q.o[q.a])}</div>`;
 const grid=Q.map((x,i)=>`<button class="${ans[i]===null?"":ans[i]===x.a?"ok":"no"} ${i===cur?"cur":""}" onclick="go(${i})">${i+1}</button>`).join("");
 app.innerHTML=`<div class="top"><span class="badge">Bab ${q.b+1}: ${esc(BAB[q.b])}</span><span class="mut">Terjawab ${done}/${Q.length}</span></div>
 <div class="bar"><i style="width:${(cur+1)/Q.length*100}%"></i></div>
 <div class="card"><div class="mut">Soal ${cur+1} dari ${Q.length}</div><div class="q">${fmt(q.t)}</div>${opts}${fb}
 <div class="nav"><button class="b g" ${cur===0?"disabled":""} onclick="go(cur-1)">← Sebelumnya</button>
 ${cur===Q.length-1?`<button class="b" onclick="finish()">Selesai</button>`:`<button class="b" onclick="go(cur+1)">Selanjutnya →</button>`}</div></div>
 <div class="grid">${grid}</div><div style="margin-top:14px;text-align:center"><button class="b g" onclick="finish()">Lihat Hasil Akhir</button></div>`;
}
function pick(i){if(ans[cur]===null){ans[cur]=i;render()}}
function go(i){cur=i;render();window.scrollTo(0,0)}
function finish(){
 const un=ans.filter(x=>x===null).length;
 if(un&&!confirm(`Masih ada ${un} soal belum dijawab. Tetap lihat hasil?`))return;
 const ok=Q.filter((q,i)=>ans[i]===q.a).length,wr=Q.filter((q,i)=>ans[i]!==null&&ans[i]!==q.a).length;
 const nilai=(ok/Q.length*100).toFixed(1).replace(/\.0$/,"");
 const bab=BAB.map((n,b)=>{const idx=Q.map((q,i)=>i).filter(i=>Q[i].b===b);const k=idx.filter(i=>ans[i]===Q[i].a).length;return `<div class="bab"><span>Bab ${b+1}: ${esc(n)}</span><b>${k}/${idx.length}</b></div>`}).join("");
 app.innerHTML=`<div class="card"><h1 style="text-align:center">Hasil Akhir</h1><div class="score">${nilai}</div><div class="mut" style="text-align:center">dari 100</div>
 <div class="stats"><div><b style="color:var(--ok);font-size:1.4rem">${ok}</b><div class="mut">Benar</div></div><div><b style="color:var(--no);font-size:1.4rem">${wr}</b><div class="mut">Salah</div></div><div><b style="font-size:1.4rem">${un}</b><div class="mut">Kosong</div></div></div>
 ${bab}<div class="nav"><button class="b g" onclick="go(0)">Tinjau Soal</button><button class="b" onclick="start()">Ulangi Kuis</button></div></div>`;
 window.scrollTo(0,0);
}
render();
</script>
